workflows:
  android-apk:
    name: استعلام الأصناف والأسعار - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android host project and copy app source
        script: |
          set -e
          BUILD_DIR="$CM_BUILD_DIR/.codemagic_build"
          SOURCE_DIR="$CM_BUILD_DIR/.source_backup"
          rm -rf "$BUILD_DIR" "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          cp -R "$CM_BUILD_DIR/lib" "$SOURCE_DIR/lib"
          cp "$CM_BUILD_DIR/pubspec.yaml" "$SOURCE_DIR/pubspec.yaml"
          flutter create --platforms=android --org com.example --project-name price_inquiry "$BUILD_DIR"
          rm -rf "$BUILD_DIR/lib"
          cp -R "$SOURCE_DIR/lib" "$BUILD_DIR/lib"
          cp "$SOURCE_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"
          cp "$CM_BUILD_DIR/codemagic_assets/AndroidManifest.xml" "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          cp "$CM_BUILD_DIR/codemagic_assets/MainActivity.kt" "$BUILD_DIR/android/app/src/main/kotlin/com/example/price_inquiry/MainActivity.kt"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('.codemagic_build/android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(text)
          PY
          cd "$BUILD_DIR"
          flutter pub get
      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR/.codemagic_build"
          flutter build apk --release
    artifacts:
      - .codemagic_build/build/app/outputs/flutter-apk/app-release.apk
