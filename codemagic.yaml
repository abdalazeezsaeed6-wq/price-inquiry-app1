workflows:
  android-apk:
    name: Price Inquiry Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Extract and prepare Flutter project
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/price_inquiry_flutter_project.zip"
          test -f "$ZIP"

          unzip -o "$ZIP" -d "$CM_BUILD_DIR"

          PROJECT_DIR="$CM_BUILD_DIR/price_inquiry_project"
          test -f "$PROJECT_DIR/pubspec.yaml"

          BUILD_DIR="$CM_BUILD_DIR/.codemagic_build"
          SOURCE_DIR="$CM_BUILD_DIR/.source_backup"

          rm -rf "$BUILD_DIR" "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          cp -R "$PROJECT_DIR/lib" "$SOURCE_DIR/lib"
          cp "$PROJECT_DIR/pubspec.yaml" "$SOURCE_DIR/pubspec.yaml"

          flutter create --platforms=android --org com.example --project-name price_inquiry "$BUILD_DIR"

          rm -rf "$BUILD_DIR/lib"
          cp -R "$SOURCE_DIR/lib" "$BUILD_DIR/lib"
          cp "$SOURCE_DIR/pubspec.yaml" "$BUILD_DIR/pubspec.yaml"

          cp "$PROJECT_DIR/codemagic_assets/AndroidManifest.xml" "$BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$BUILD_DIR/android/app/src/main/kotlin/com/example/price_inquiry"
          cp "$PROJECT_DIR/codemagic_assets/MainActivity.kt" "$BUILD_DIR/android/app/src/main/kotlin/com/example/price_inquiry/MainActivity.kt"

          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('.codemagic_build/android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(text)
          PY

          cd "$BUILD_DIR"

          python3 - <<'PY'

from pathlib import Path

p = Path("pubspec.yaml")
content = p.read_text()

old = "pdf: ^3.13.1"
new = "pdf: 3.12.0"

if old not in content:
    raise SystemExit("لم يتم العثور على إصدار pdf القديم")

p.write_text(content.replace(old, new))
print("تم تثبيت إصدار pdf على 3.12.0")

